name: flink-connector-aws
description: Lyft-patched fork of Apache Flink Connector AWS
repository: git@github.com:lyft/flink-connector-aws.git
slack: '#streaming-compute-bots'
pagerduty_escalation_policy: 'Streaming Compute'
notification_overrides:
  deploy:
    slack: '#streaming-compute-bots'
  deploy_failure:
    slack: '#streaming-compute-bots'
  test_failure:
    slack: '#streaming-compute-bots'
  master_failure:
    slack: '#streaming-compute-bots'
  pr_open:
    slack: '#streaming-compute-bots'
  pr_merge:
    slack: '#streaming-compute-bots'
  pr_ptal:
    slack: '#streaming-compute-dev-prs'
team_email: streaming-compute@lyft.com
builder:
  name: s2iplus
  params:
    builder: lyft/s2ijava:java11.3dbb2a4de2661001812d0f083b79591f8aad00a6
    buildargs:
      - BUILD_ARGS=-DskipTests
    packages:
      - git

containers:
  - name: releasesemver
    command: bash -c 'make -C /code/flink-connector-aws release_production_next_semver'
    requests:
      cpu: 6
      memory: 4Gi
  - name: releasesnapshot
    command: bash -c 'make -C /code/flink-connector-aws release_production'
    requests:
      cpu: 6
      memory: 4Gi

facets:
  - name: releasesemver
    member: flink-connector-aws.releasesemver
    type: job
    iam:
      roles:
        production: java-production-iad-deploy
  - name: releasesnapshot
    member: flink-connector-aws.releasesnapshot
    type: job
    iam:
      roles:
        staging: java-staging-iad-deploy

deploy:
  - name: snapshot
    automatic: true
    legacy: false
    environment: staging
    kubernetes:
      enabled: true
    targets:
      - facet: releasesnapshot
  - name: semver
    automatic: false
    legacy: false
    environment: production
    kubernetes:
      enabled: true
    targets:
      - facet: releasesemver

languages:
  - java
image_type: library
owner:
  team: Data Platform
  group: Infrastructure
  organization: Foundations & AI Transformation
ci:
  egress_mode: transparent_proxy
